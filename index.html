<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Get Ready with Me</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="routine-card">
      <h1>What is The Order of Your Getting-ready Routine?</h1>
      <p>
        Click the buttons to see which is your to-go routine on makeup, hair,
        and outfit!
      </p>
      <div class="image-gallery">
        <figure class="image-polaroid">
          <img id="image1" src="images/makeup1.jpg" alt="makeup" height="300" />
          <figcaption>You will have a flawless makeup base!</figcaption>
        </figure>
        <figure class="image-polaroid">
          <img id="image2" src="images/hair1.jpg" alt="hair" height="300" />
          <figcaption>You're gonna have a full blown!</figcaption>
        </figure>
        <figure class="image-polaroid">
          <img id="image3" src="images/outfit1.jpg" alt="outfit" height="300" />
          <figcaption>Your outfit ATE!</figcaption>
        </figure>
      </div>
      <div class="routine-buttons">
        <button id="sequence-one">Routine One</button>
        <button id="sequence-two">Routine Two</button>
      </div>
    </main>
    <script src="script.js"></script>

  </body>
</html>
